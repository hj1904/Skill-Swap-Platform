<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages - SkillSwap</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f8fafc;
font-family:'Segoe UI',sans-serif;
}

.chat-box{
background:white;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.06);
height:80vh;
display:flex;
flex-direction:column;
}

.chat-header{
padding:18px;
border-bottom:1px solid #e5e7eb;
font-weight:700;
}

.chat-body{
flex:1;
padding:20px;
overflow-y:auto;
}

.msg-left,.msg-right{
padding:10px 14px;
border-radius:14px;
margin-bottom:12px;
max-width:70%;
}

.msg-left{
background:#e2e8f0;
}

.msg-right{
background:#38bdf8;
color:white;
margin-left:auto;
}

.chat-footer{
padding:15px;
border-top:1px solid #e5e7eb;
}

</style>
</head>
<body>

<div class="container py-4">

<div class="chat-box">

<div class="chat-header">
Chat with Learner
</div>

<div class="chat-body">

<div class="msg-left">Hi, can you teach Python basics?</div>

<div class="msg-right">Yes sure, when would you like to start?</div>

</div>

<div class="chat-footer">

<form class="d-flex">

<input type="text" class="form-control me-2" placeholder="Type message...">

<button class="btn btn-primary">Send</button>

</form>

</div>

</div>

</div>

</body>
</html>
