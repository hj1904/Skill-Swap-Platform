<!DOCTYPE html>
<html>
<head>
<title>User Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

<div class="card p-5 shadow">

<div class="text-center">

<img src="/static/uploads/{{user.photo}}" width="120" height="120"
style="border-radius:50%; object-fit:cover;">

<h2 class="mt-3">{{user.name}}</h2>
<p>{{user.email}}</p>

<p><b>Connections:</b> {{connections}}</p>

</div>

<hr>

<div class="row">

<div class="col-md-6">
<h4 class="text-primary">Can Teach</h4>

{% for s in teach_skills %}
<p>✔ {{s.skill_name}}</p>
{% endfor %}

</div>

<!-- <div class="col-md-6">
<h4 class="text-success">Wants To Learn</h4>

{% for s in learn_skills %}
<p>✔ {{s.skill_name}}</p>
{% endfor %}

</div> -->

</div>

<a href="/search" class="btn btn-dark mt-4">
⬅ Back
</a>

</div>

</div>

</body>
</html>
