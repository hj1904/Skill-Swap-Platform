<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - SkillSwap</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-box{
background:white;
padding:40px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
width:100%;
max-width:430px;
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.title{
font-weight:700;
color:#0f172a;
}

.subtitle{
color:#64748b;
font-size:15px;
margin-bottom:25px;
}

.form-control{
padding:12px;
border-radius:10px;
margin-bottom:15px;
}

.form-control:focus{
box-shadow:none;
border-color:#38bdf8;
}

.btn-main{
background:#38bdf8;
color:white;
padding:12px;
border:none;
border-radius:10px;
font-weight:600;
}

.btn-main:hover{
background:#0ea5e9;
color:white;
}

.bottom-text{
text-align:center;
margin-top:18px;
font-size:14px;
}

.bottom-text a{
text-decoration:none;
color:#38bdf8;
font-weight:600;
}

.icon-box{
text-align:center;
font-size:45px;
color:#38bdf8;
margin-bottom:15px;
}

</style>

</head>
<body>

<div class="login-box">

<div class="icon-box">
<i class="fas fa-user-circle"></i>
</div>

<h2 class="title text-center">Welcome Back</h2>
<p class="subtitle text-center">Login to continue your learning journey</p>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-danger">
      {{ messages[0] }}
    </div>
  {% endif %}
{% endwith %}

<form action="/login_user" method="POST">

<input type="email" name="email" class="form-control" placeholder="Email Address" required>

<input type="password" name="password" class="form-control" placeholder="Password" required>

<button class="btn btn-main w-100">Login</button>

</form>

<div class="bottom-text">
Don't have an account? <a href="/register">Register</a>
</div>

</div>

</body>
</html>
